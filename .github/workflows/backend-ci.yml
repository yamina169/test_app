# Automated Backend CI workflow enforcing linting, type safety, testing, security auditing, and Docker build validation.
name: Backend CI
on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "refactor/**"
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "apps/backend/**"
      - ".github/workflows/backend-ci.yml"
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --workspace=apps/backend
      - name: Type Check
        run: npm run type-check --workspace=apps/backend
      - name: Security audit
        run: npm audit --audit-level=high --workspace=apps/backend
      - name: Unit Tests
        run: npm test --workspace=apps/backend
      - name: Build
        run: npm run build --workspace=apps/backend
